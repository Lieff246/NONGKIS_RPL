<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NONGKIS - Tempat Nongkrong Asik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <h2>🏖️ NONGKIS</h2>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link active">Beranda</a>
                <a href="#tempat" class="nav-link">Tempat</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="nav-link">Daftar</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Temukan Tempat Nongkrong Terbaik di Kota Palu</h1>
            <p>Untuk Nongkrong Santai, Mengerjakan Tugas, atau Diskusi Kelompok</p>
            <a href="register.html" class="cta-button">Mulai Sekarang</a>
        </div>
    </section>

    <!-- Places Section -->
    <section id="tempat" class="places-section">
        <div class="container">
            <h2>📌 Tempat Nongkrong Populer di Kota Palu</h2>
            
            <!-- Filter -->
            <div class="filter-container">
                <select id="categoryFilter" class="filter-select">
                    <option value="">🎯 Semua Kategori</option>
                    <option value="nongkrong">🏖️ Nongkrong Santai</option>
                    <option value="tugas">📚 Mengerjakan Tugas</option>
                    <option value="diskusi">👥 Diskusi Kelompok</option>
                </select>
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari tempat...">
            </div>

            <!-- Places Grid -->
            <div id="placesList" class="places-grid">
                <!-- Tempat akan dimuat di sini -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 NONGKIS - Kelompok 8 RPL</p>
            <p>Alif Apriansyah, Elika Khardalia, Achmad Aulia Irsyad</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
